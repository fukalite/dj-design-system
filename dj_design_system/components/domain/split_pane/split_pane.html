<dds-split-pane class="dds-split-pane"
                data-orientation="{{ resolved_orientation }}"
                data-min-ratio="{{ resolved_min_ratio }}"
                data-max-ratio="{{ resolved_max_ratio }}"
                style="--_split-pane-ratio: {{ resolved_ratio }}%;">
  <div data-split-pane="primary"{% if has_primary_surface %} data-surface="{{ primary_surface }}"{% endif %}>
    {% if has_primary_label %}
      <div data-split-pane-header>{{ primary_label }}</div>
    {% endif %}
    <div data-split-pane-body>{{ primary_content }}</div>
  </div>
  <div data-split-resizer
       role="separator"
       tabindex="0"
       aria-orientation="{{ separator_aria_orientation }}"
       aria-label="{{ resolved_resizer_label }}"
       aria-valuemin="{{ resolved_min_ratio }}"
       aria-valuemax="{{ resolved_max_ratio }}"
       aria-valuenow="{{ resolved_ratio }}"></div>
  <div data-split-pane="secondary"{% if has_secondary_surface %} data-surface="{{ secondary_surface }}"{% endif %}>
    {% if has_secondary_label %}
      <div data-split-pane-header>{{ secondary_label }}</div>
    {% endif %}
    <div data-split-pane-body>{{ secondary_content }}</div>
  </div>
</dds-split-pane>

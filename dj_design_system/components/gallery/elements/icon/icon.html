<svg class="dds-icon"
     data-size="{{ size }}"
     data-icon="{{ name }}"
     viewBox="0 0 24 24"
     fill="none"
     stroke="currentColor"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round"
     {% if aria_hidden %}aria-hidden="{{ aria_hidden }}"{% endif %}
     {% if role %}role="{{ role }}"{% endif %}
     {% if label %}aria-label="{{ label }}"{% endif %}>
  {% if name == "external-link" %}
    <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
    <polyline points="15 3 21 3 21 9" />
    <line x1="10" y1="14" x2="21" y2="3" />
  {% elif name == "eye" %}
    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
    <circle cx="12" cy="12" r="3" />
  {% elif name == "code" %}
    <polyline points="16 18 22 12 16 6" />
    <polyline points="8 6 2 12 8 18" />
  {% elif name == "file-code" %}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
    <polyline points="14 2 14 8 20 8" />
    <polyline points="10 13 8 15 10 17" />
    <polyline points="14 13 16 15 14 17" />
  {% elif name == "monitor" %}
    <rect x="2" y="3" width="20" height="14" rx="2" />
    <line x1="8" y1="21" x2="16" y2="21" />
    <line x1="12" y1="17" x2="12" y2="21" />
  {% elif name == "box-model" %}
    <rect x="1" y="1" width="22" height="22" rx="2" stroke-dasharray="4 2" />
    <rect x="5" y="5" width="14" height="14" rx="1" />
    <rect x="9" y="9" width="6" height="6" rx="0.5" />
  {% elif name == "ruler" %}
    <path d="M2 2v20h20" />
    <path d="M6 18V8" />
    <path d="M4 8h4" />
    <path d="M4 18h4" />
    <path d="M10 18h8" />
    <path d="M10 16v4" />
    <path d="M18 16v4" />
  {% elif name == "rtl" %}
    <path d="M10 5v14" />
    <path d="M14 5v14" />
    <path d="M14 5h2a4 4 0 0 1 0 8h-2" />
    <path d="M7 15l-3-3 3-3" />
  {% elif name == "component" %}
    <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" />
    <polyline points="3 7 12 12 21 7" />
    <line x1="12" y1="12" x2="12" y2="22" />
  {% elif name == "doc" %}
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
    <polyline points="14 2 14 8 20 8" />
    <line x1="8" y1="13" x2="16" y2="13" />
    <line x1="8" y1="17" x2="16" y2="17" />
  {% elif name == "folder" %}
    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
  {% elif name == "folder-open" %}
    <path d="M5 19a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v3" />
    <path d="M3 19l2.5-9h16.5l-2.5 9H3z" />
  {% elif name == "search" %}
    <circle cx="11" cy="11" r="7" />
    <line x1="21" y1="21" x2="16.65" y2="16.65" />
  {% elif name == "menu" %}
    <line x1="3" y1="6" x2="21" y2="6" />
    <line x1="3" y1="12" x2="21" y2="12" />
    <line x1="3" y1="18" x2="21" y2="18" />
  {% elif name == "close" %}
    <line x1="18" y1="6" x2="6" y2="18" />
    <line x1="6" y1="6" x2="18" y2="18" />
  {% elif name == "chevron-right" %}
    <polyline points="9 18 15 12 9 6" />
  {% elif name == "chevron-down" %}
    <polyline points="6 9 12 15 18 9" />
  {% elif name == "copy" %}
    <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
  {% elif name == "check" %}
    <polyline points="20 6 9 17 4 12" />
  {% elif name == "sun" %}
    <circle cx="12" cy="12" r="5" />
    <line x1="12" y1="1" x2="12" y2="3" />
    <line x1="12" y1="21" x2="12" y2="23" />
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
    <line x1="1" y1="12" x2="3" y2="12" />
    <line x1="21" y1="12" x2="23" y2="12" />
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
  {% elif name == "moon" %}
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
  {% elif name == "reset" %}
    <polyline points="1 4 1 10 7 10" />
    <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
  {% elif name == "info" %}
    <circle cx="12" cy="12" r="10" />
    <line x1="12" y1="16" x2="12" y2="12" />
    <line x1="12" y1="8" x2="12.01" y2="8" />
  {% elif name == "success" %}
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
    <polyline points="22 4 12 14.01 9 11.01" />
  {% elif name == "warning" %}
    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
    <line x1="12" y1="9" x2="12" y2="13" />
    <line x1="12" y1="17" x2="12.01" y2="17" />
  {% elif name == "error" %}
    <circle cx="12" cy="12" r="10" />
    <line x1="15" y1="9" x2="9" y2="15" />
    <line x1="9" y1="9" x2="15" y2="15" />
  {% endif %}
</svg>

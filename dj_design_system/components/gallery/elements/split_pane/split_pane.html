<dds-split-pane class="dds-split-pane"
                data-orientation="{{ resolved_orientation }}"
                data-min-ratio="{{ resolved_min_ratio }}"
                data-max-ratio="{{ resolved_max_ratio }}"
                style="--_split-pane-ratio: {{ resolved_ratio }}%;">
  <div data-split-pane="primary">{{ primary_content }}</div>
  <div data-split-resizer
       role="separator"
       tabindex="0"
       aria-orientation="{{ separator_aria_orientation }}"
       aria-label="{{ resolved_resizer_label }}"
       aria-valuemin="{{ resolved_min_ratio }}"
       aria-valuemax="{{ resolved_max_ratio }}"
       aria-valuenow="{{ resolved_ratio }}"></div>
  <div data-split-pane="secondary">{{ secondary_content }}</div>
</dds-split-pane>

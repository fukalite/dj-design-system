{% load design_components %}
<dds-theme-select class="dds-theme-select" data-active-theme="{{ resolved_active_theme }}" {{ attrs }}>
  <div data-theme-control>
    {% if show_icon and active_icon %}
      {% dds__icon name=active_icon size="sm" %}
    {% endif %}
    <select id="{{ select_id }}" data-theme-select aria-label="{{ label }}" title="{{ label }}">
      {% for item in normalized_themes %}
        <option value="{{ item.value }}"{% if item.is_selected %} selected{% endif %}>{{ item.label }}</option>
      {% endfor %}
    </select>
  </div>
</dds-theme-select>

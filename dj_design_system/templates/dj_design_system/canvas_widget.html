<div class="gallery-md-canvas {% if extra_classes %}{{ extra_classes }}{% endif %}">
    <input type="radio"
           name="mc-toggle-{{ unique_id }}"
           id="mc-preview-{{ unique_id }}"
           class="gallery-md-canvas__input gallery-md-canvas__input--preview"
           checked>
    <input type="radio"
           name="mc-toggle-{{ unique_id }}"
           id="mc-code-{{ unique_id }}"
           class="gallery-md-canvas__input gallery-md-canvas__input--code">
    <input type="radio"
           name="mc-toggle-{{ unique_id }}"
           id="mc-html-{{ unique_id }}"
           class="gallery-md-canvas__input gallery-md-canvas__input--html">
    <div class="gallery-md-canvas__toggles">
        <label for="mc-preview-{{ unique_id }}"
               class="gallery-md-canvas__label"
               title="Preview">
            <svg width="14"
                 height="14"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
            </svg>
        </label>
        <label for="mc-code-{{ unique_id }}"
               class="gallery-md-canvas__label"
               title="Template Source">
            <svg width="14"
                 height="14"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6" /><polyline points="8 6 2 12 8 18" />
            </svg>
        </label>
        <label for="mc-html-{{ unique_id }}"
               class="gallery-md-canvas__label"
               title="Output HTML">
            <svg width="14"
                 height="14"
                 viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2"
                 stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                <polyline points="14 2 14 8 20 8" /><polyline points="10 13 8 15 10 17" /><polyline points="14 13 16 15 14 17" />
            </svg>
        </label>
    </div>
    <div class="gallery-md-canvas__preview">
        <iframe class="gallery-canvas {% if iframe_class %}{{ iframe_class }}{% else %}gallery-md-canvas__iframe{% endif %}"
                {% if iframe_srcdoc %}srcdoc="{{ iframe_srcdoc }}"{% endif %}
                {% if iframe_src %}src="{{ iframe_src }}"{% endif %}
                data-canvas-id="{{ unique_id }}"
                {% if sandbox_attrs %}sandbox="{{ sandbox_attrs }}"{% endif %}
                loading="lazy"
                title="Component preview"></iframe>
    </div>
    <div class="gallery-md-canvas__code">
        <div class="gallery-highlight">
            <pre><code>{{ source_html|safe }}</code></pre>
        </div>
    </div>
    <div class="gallery-md-canvas__html">
        <div class="gallery-highlight">
            <pre><code>{{ rendered_output_html|safe }}</code></pre>
        </div>
    </div>
</div>

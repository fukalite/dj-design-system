name: CI

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run linters
        run: just check

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dev dependencies
        run: uv pip install -e ".[dev]"

      - name: Run mypy
        run: just typecheck

  test:
    name: "Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-label }})"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            django-version: "Django>=5.2,<6"
            django-label: "5.2"
            coverage: true
          - python-version: "3.12"
            django-version: "Django>=6.0,<7"
            django-label: "6.0"
            coverage: false
          - python-version: "3.12"
            django-version: "Django"
            django-label: "latest"
            coverage: false
          - python-version: "3.13"
            django-version: "Django>=5.2,<6"
            django-label: "5.2"
            coverage: true
          - python-version: "3.13"
            django-version: "Django>=6.0,<7"
            django-label: "6.0"
            coverage: false
          - python-version: "3.13"
            django-version: "Django"
            django-label: "latest"
            coverage: false
          - python-version: "3.14"
            django-version: "Django>=5.2,<6"
            django-label: "5.2"
            coverage: false
          - python-version: "3.14"
            django-version: "Django>=6.0,<7"
            django-label: "6.0"
            coverage: false
          - python-version: "3.14"
            django-version: "Django"
            django-label: "latest"
            coverage: false
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Install testing dependencies
        run: uv pip install -e ".[dev]"

      - name: Pin Django version
        run: uv pip install "${{ matrix.django-version }}"

      - name: Run tests (with coverage)
        if: matrix.coverage
        run: uv run --no-sync pytest tests/ -m "not e2e" --cov --cov-report=xml

      - name: Run tests
        if: "!matrix.coverage"
        run: uv run --no-sync pytest tests/ -m "not e2e"

      - name: Coverage comment
        if: matrix.coverage && github.event_name == 'pull_request'
        uses: MishaKav/pytest-coverage-comment@v1
        with:
          pytest-xml-coverage-path: coverage.xml
          title: Test Coverage
          github-token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install testing dependencies
        run: uv pip install -e ".[dev]"

      - name: Install Playwright browsers
        run: just install-playwright

      - name: Run E2E tests
        run: just e2e

  visual-regression:
    name: Visual Regression
    # Same image and architecture (linux/amd64) the baselines are rendered in
    # by `just update-visual-baselines`; the tag must match the justfile's
    # playwright_version (tests/test_visual_config.py enforces this).
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.63.0-noble
      options: --ipc=host --init
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv pip install -e ".[dev]" "playwright==$(just --evaluate playwright_version)"

      - name: Compare gallery screenshots to baselines
        run: |
          set -o pipefail
          just visual-run 2>&1 | tee visual.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-actual
          path: tests/e2e/visual/output/actual
          if-no-files-found: ignore

      - name: Upload failure diffs
        id: diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-diffs
          path: tests/e2e/visual/output/failures
          if-no-files-found: ignore

      - name: Summarise failures
        if: failure()
        run: |
          {
            echo "## Visual regression failures"
            echo
            grep -hE "ScreenshotMismatch: |did not finish resizing|still clipped" visual.log \
              | sed -E 's/^E +//; s/.*ScreenshotMismatch: //; s/^/- /' | sort -u
            echo
            if [ -n "${{ steps.diffs.outputs.artifact-url }}" ]; then
              echo "Expected, actual and diff images: [visual-regression-diffs](${{ steps.diffs.outputs.artifact-url }})"
            fi
            echo
            echo "If the change is intended, run \`just update-visual-baselines\` locally (requires Docker) and commit the updated baselines, explaining why in the PR."
          } >> "$GITHUB_STEP_SUMMARY"

  ci-complete:
    name: CI Complete
    needs: [lint, typecheck, test, e2e, visual-regression]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more CI jobs failed or were cancelled"
            exit 1
          fi
          echo "All CI jobs passed"

name: Publish to Test PyPI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write

jobs:
  publish-test:
    name: Publish to Test PyPI
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: test-pypi

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history needed so hatch-vcs can derive the version from git tags
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Compile TypeScript components
        run: |
          npm ci
          npx tsc -p tsconfig.json

      - name: Build package
        run: uv build

      - name: Publish to Test PyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/

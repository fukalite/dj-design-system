name: Deploy Docs & Gallery

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Build MkDocs site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build docs
        run: uv run mkdocs build --strict
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: site/

  build-gallery:
    name: Build gallery snapshot
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Collect static files
        run: uv run python example_project/manage.py collectstatic --noinput
        env:
          DJANGO_SETTINGS_MODULE: example_project.settings

      - name: Start dev server
        run: |
          uv run python example_project/manage.py runserver 8000 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/ > /dev/null && break
            sleep 1
          done
        env:
          DJANGO_SETTINGS_MODULE: example_project.settings

      - name: Snapshot gallery with wget
        run: |
          # --exclude-directories=_canvas keeps the canvas iframe src attrs as
          # absolute URLs (/_canvas/?component=…) so the Python step below can
          # fetch, clean-name, and patch them properly.
          # --restrict-file-names=windows saves query-string pages (e.g.
          # ?variant=x) with '@' in place of '?', which artifact uploads reject,
          # and --convert-links rewrites links to match.
          wget \
            --mirror \
            --convert-links \
            --adjust-extension \
            --restrict-file-names=windows \
            --no-host-directories \
            --no-parent \
            --page-requisites \
            --reject "*.py,*.pyc" \
            --exclude-directories=/_canvas \
            --directory-prefix=gallery-snapshot \
            http://localhost:8000/ || wget_exit=$?
          # Exit code 8 = server errors on individual pages (expected for broken demo
          # components); treat it as success so the snapshot still gets published.
          if [ "${wget_exit:-0}" -ne 0 ] && [ "${wget_exit:-0}" -ne 8 ]; then
            exit "$wget_exit"
          fi

      - name: Save canvas iframe pages as clean static files
        run: |
          python3 .github/scripts/save_canvas_pages.py \
            gallery-snapshot \
            http://localhost:8000
          # Jekyll (which GitHub Pages may invoke) silently ignores directories
          # starting with '_' (including _canvas). .nojekyll disables that.
          touch gallery-snapshot/.nojekyll
        env:
          DJANGO_SETTINGS_MODULE: example_project.settings

      - name: Upload gallery artifact
        uses: actions/upload-artifact@v4
        with:
          name: gallery-snapshot
          path: gallery-snapshot/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build-docs, build-gallery]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download docs
        uses: actions/download-artifact@v7
        with:
          name: docs-site
          path: site/

      - name: Download gallery
        uses: actions/download-artifact@v7
        with:
          name: gallery-snapshot
          path: site/demo/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
